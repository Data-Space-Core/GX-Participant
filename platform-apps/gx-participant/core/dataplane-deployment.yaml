apiVersion: apps/v1
kind: Deployment
metadata:
  name: gx-participant-dataplane
  namespace: gx-participant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gx-participant-dataplane
  template:
    metadata:
      annotations:
        config-version: "dataplane-018-http-s3-20260916-6"
      labels:
        app.kubernetes.io/name: gx-participant-dataplane
    spec:
      containers:
        - name: dataplane
          image: ghcr.io/data-space-core/dataplane:edc-018-http-s3-20260916-6
          imagePullPolicy: Always
          command:
            - java
            - -jar
            - /app/dataplane.jar
          env:
            - name: EDC_FS_CONFIG
              value: /app/configuration.properties
            - name: EDC_PARTICIPANT_ID
              valueFrom:
                configMapKeyRef:
                  name: participant-settings
                  key: PARTICIPANT_DID
            - name: EDC_DPF_SELECTOR_URL
              value: http://gx-participant-controlplane:8081/api/management/v4/dataplanes
            - name: EDC_CONTROL_ENDPOINT
              value: http://gx-participant-dataplane:8083/api/control
            - name: EDC_CONTROLPLANE_API_AUTH_VALUE
              valueFrom:
                secretKeyRef:
                  name: gx-participant-dataplane-auth
                  key: authorization
            - name: WEB_HTTP_PORT
              value: "8080"
            - name: WEB_HTTP_PATH
              value: /api
            - name: WEB_HTTP_CONTROL_PORT
              value: "8083"
            - name: WEB_HTTP_CONTROL_PATH
              value: /api/control
            - name: WEB_HTTP_PUBLIC_PORT
              value: "11001"
            - name: WEB_HTTP_PUBLIC_PATH
              value: /api/public
            - name: EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS
              valueFrom:
                configMapKeyRef:
                  name: participant-settings
                  key: PARTICIPANT_DID_KEY_ID
            - name: EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS
              valueFrom:
                secretKeyRef:
                  name: participant-bootstrap
                  key: participant-private-key-alias.txt
            - name: EDC_VAULT_HASHICORP_URL
              value: http://gx-participant-vault:8200
            - name: EDC_VAULT_HASHICORP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gx-participant-stack
                  key: EDC_VAULT_HASHICORP_TOKEN
            - name: EDC_VAULT_HASHICORP_API_SECRET_PATH
              value: /v1/secret
            - name: EDC_DATASOURCE_DEFAULT_URL
              value: jdbc:postgresql://gx-participant-postgres:5432/participant
            - name: EDC_DATASOURCE_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: gx-participant-stack
                  key: POSTGRES_USER
            - name: EDC_DATASOURCE_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gx-participant-stack
                  key: POSTGRES_PASSWORD
            - name: EDC_SQL_SCHEMA_AUTOCREATE
              value: "true"
            - name: EDC_IAM_STS_OAUTH_TOKEN_URL
              value: http://gx-participant-identityhub:7086/api/sts/token
            - name: EDC_IAM_STS_OAUTH_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: participant-settings
                  key: PARTICIPANT_DID
            - name: EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS
              valueFrom:
                secretKeyRef:
                  name: participant-bootstrap
                  key: participant-sts-client-secret-alias.txt
          ports:
            - containerPort: 8080
              name: web
            - containerPort: 8083
              name: control
            - containerPort: 11001
              name: public
          readinessProbe:
            httpGet:
              path: /api/check/readiness
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/check/liveness
              port: 8080
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /api/check/startup
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: dataplane-config
              mountPath: /app/configuration.properties
              subPath: configuration.properties
              readOnly: true
      volumes:
        - name: dataplane-config
          configMap:
            name: gx-participant-dataplane-config
