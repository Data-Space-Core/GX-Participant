apiVersion: v1
kind: ConfigMap
metadata:
  name: gx-participant-controlplane-config
  namespace: gx-participant
data:
  configuration.properties: |
    # The filesystem configuration is authoritative for this runtime. These
    # values must be present for the embedded participant-context provider.
    edc.participant.id=did:web:gx-participant1.dil.collab-cloud.eu:identity
    edc.participant.context.id=did:web:gx-participant1.dil.collab-cloud.eu:identity
    edc.iam.trustedissuer.material.id=did:web:dil-connector.material.dil.collab-cloud.eu:issuer
    edc.iam.trustedissuer.material.supportedtypes=["VerifiableCredential","MembershipCredential"]
    # Default DCP scope requested when GX calls a remote DSP endpoint.
    edc.iam.dcp.scopes.membership.id=membership
    edc.iam.dcp.scopes.membership.type=DEFAULT
    edc.iam.dcp.scopes.membership.value=org.eclipse.dspace.dcp.vc.type:MembershipCredential:read
    edc.iam.dcp.scopes.membership.profile=*
